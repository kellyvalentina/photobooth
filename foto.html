<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomar fotos · #TeamSistemas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=3" />
  <link rel="stylesheet" href="foto.css?v=3" />
</head>
<body>
  <div class="stars"></div>
  <button class="back-btn" onclick="window.location.href='index.html'">← Volver</button>

  <h1>★ ⋆Tómate 4 fotos⋆ ★</h1>

  <div class="camera-layout tarjeta">
    <div class="camera-column">
      <div class="video-marco">
        <video id="camera" autoplay playsinline muted></video>
        <div id="countdown" class="countdown" hidden></div>
        <p id="cameraError" class="camera-error texto-sistema" hidden>
          No pudimos abrir la cámara 😭<br>
          Revisa el permiso en tu navegador o usa
          <a href="subir.html">Subir fotos</a>.
        </p>
      </div>
      <button id="captureBtn" class="btn" disabled>📸 Tomar foto</button>
      <p class="ayuda texto-sistema">Toca ✕ en una miniatura para repetirla.</p>
    </div>

    <div class="thumbnails">
      <div class="thumb-wrapper"><canvas class="thumb"></canvas><button class="remove" aria-label="Repetir foto 1">✕</button></div>
      <div class="thumb-wrapper"><canvas class="thumb"></canvas><button class="remove" aria-label="Repetir foto 2">✕</button></div>
      <div class="thumb-wrapper"><canvas class="thumb"></canvas><button class="remove" aria-label="Repetir foto 3">✕</button></div>
      <div class="thumb-wrapper"><canvas class="thumb"></canvas><button class="remove" aria-label="Repetir foto 4">✕</button></div>
    </div>
  </div>

  <button id="createStripBtn" class="btn azul" disabled>Crear photostrip ✨</button>

  <script src="foto.js?v=3"></script>
</body>
</html>
