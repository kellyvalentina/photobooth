<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir fotos · #TeamSistemas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="subir.css" />
</head>
<body>
  <div class="stars"></div>
  <button class="back-btn" onclick="window.location.href='index.html'">← Volver</button>

  <main class="upload-page">
    <h1>★ ⋆Sube tus fotos⋆ ★</h1>

    <label class="upload-box tarjeta" id="dropZone">
      <input type="file" accept="image/*" multiple hidden />
      <span class="icon">☁️</span>
      <p>Toca para elegir de tu galería<br><span class="solo-escritorio">o arrastra las fotos aquí</span></p>
      <small class="texto-sistema">Necesitas 4 fotos para continuar</small>
      <span class="btn suave choose-btn">Elegir fotos</span>
    </label>

    <p class="uploaded-title">Tus fotos <span id="contador">0/4</span></p>

    <div class="uploaded-photos">
      <div class="photo-slot"><button class="remove-btn" aria-label="Quitar foto 1">✕</button></div>
      <div class="photo-slot"><button class="remove-btn" aria-label="Quitar foto 2">✕</button></div>
      <div class="photo-slot"><button class="remove-btn" aria-label="Quitar foto 3">✕</button></div>
      <div class="photo-slot"><button class="remove-btn" aria-label="Quitar foto 4">✕</button></div>
    </div>

    <button id="createStripBtn" class="btn azul" disabled>Crear photostrip ✨</button>
  </main>

  <script src="upload.js"></script>
</body>
</html>
