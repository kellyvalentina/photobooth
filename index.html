<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>#TeamSistemas photobooth</title>
  <meta name="description" content="Photobooth de la Señorita Ing. de Sistemas, Kelly Sánchez. ¡Tómate la foto y comparte con #TeamSistemas!">
  <meta property="og:title" content="#TeamSistemas photobooth">
  <meta property="og:description" content="Tómate tu photostrip y apoya a la Señorita Ing. de Sistemas ✨">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="photobooth.css">
</head>
<body>
  <div class="stars"></div>

  <main class="home tarjeta">
    <div class="avatar-marco">
      <img class="avatar" src="avatar.svg" alt="Avatar de Kelly Sánchez" width="120" height="120">
    </div>

    <p class="etiqueta">Señorita Ing. de Sistemas</p>
    <h1>Kelly Sánchez</h1>
    <p class="hashtag-grande">#TeamSistemas</p>

    <p class="subtitulo texto-sistema">
      ¡Tómate tu photostrip, súbelo a tus redes y etiqueta a la U! 📸
    </p>

    <div class="botones">
      <button id="takePhotoBtn" class="btn">Tomar fotos</button>
      <button id="uploadPhotoBtn" class="btn azul">Subir fotos</button>
    </div>

    <p class="descripcion texto-sistema">
      Con “Tomar fotos” usas la cámara; con “Subir fotos” armas la tira con 4 fotos de tu galería.
    </p>
  </main>

  <p class="firma">⋆｡˚ʚ hecho con código por Kelly ɞ˚｡⋆</p>

  <script src="home.js"></script>
</body>
</html>
