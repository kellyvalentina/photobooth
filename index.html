<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El photobooth de la Srta. Ing. de Sistemas</title>
  <meta name="description" content="Tómate tu photostrip y compártelo con #TeamSistemas">
  <meta property="og:title" content="El photobooth de la Srta. Ing. de Sistemas">
  <meta property="og:description" content="Tómate tu photostrip y compártelo con #TeamSistemas ✨">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css?v=3">
  <link rel="stylesheet" href="photobooth.css?v=3">
</head>
<body>
  <div class="stars"></div>

  <main class="principal">
    <section class="home tarjeta">
      <img class="avatar" src="avatar.svg?v=3" alt="Avatar de Kelly, Srta. Ing. de Sistemas" width="64" height="104">

      <h1>⋆༺El photobooth de la Srta. Ing. de Sistemas༻⋆</h1>

      <p class="subtitulo texto-sistema">
        ¡Crea recuerdos bonitos con tus amigos! <span class="hashtag">#TeamSistemas</span>
      </p>

      <div class="botones">
        <button id="takePhotoBtn" class="btn">Tomar fotos</button>
        <button id="uploadPhotoBtn" class="btn azul">Subir fotos</button>
      </div>

      <p class="descripcion texto-sistema">
        Elige “Subir fotos” para crear tu tira con fotos de tu galería,
        o “Tomar fotos” para capturar nuevos recuerdos con la cámara.
      </p>
    </section>
  </main>

  <p class="firma">⋆｡˚ʚ hecho con código por Kelly ɞ˚｡⋆</p>

  <script src="home.js?v=3"></script>
</body>
</html>
